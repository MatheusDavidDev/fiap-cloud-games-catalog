apiVersion: apps/v1
kind: Deployment

metadata:
  name: catalog-api

spec:
  replicas: 1

  selector:
    matchLabels:
      app: catalog-api

  template:

    metadata:
      labels:
        app: catalog-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"

    spec:

      containers:

      - name: catalog-api

        image: catalog-api:latest

        imagePullPolicy: IfNotPresent 

        ports:
        - containerPort: 8080


        resources:

          limits:
            memory: "512Mi"

          requests:
            memory: "256Mi"


        envFrom:

        - configMapRef:
            name: catalog-config
            
        - configMapRef:
            name: catalog-config

        - secretRef:
            name: catalog-secret

 