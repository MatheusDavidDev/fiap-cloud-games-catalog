name: "fgc-catalog-docker"
services:
  rabbitmq:

    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    networks:
      - fcg-network

  catalog-db:
    image: mcr.microsoft.com/mssql/server:2025-latest

    container_name: fcg-catalog-sql-db
    ports:
      - "1433:1433"

    deploy:
      resources:
        limits:
          memory: 1500M     
        reservations:
          memory: 1000M

    environment:
      SA_PASSWORD: ${SQL_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"

    volumes:
      - catalog-data:/var/opt/mssql
      
    restart: unless-stopped

    networks:
      - fcg-network

  catalog-redis:
    image: redis:7-alpine
    container_name: fcg-catalog-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - fcg-network

  catalog-api:
     build:
       context: .
       dockerfile: Dockerfile

     container_name: fcg-catalog-api

     ports:
       - "5002:8080"

     depends_on:
       - catalog-db
       - catalog-redis
       - rabbitmq
       - mongodb
       - opensearch

     deploy:
       resources:
         limits:
           memory: 512M      
         reservations:
           memory: 256M 

     environment:
        ASPNETCORE_ENVIRONMENT: "Development"
        ASPNETCORE_HTTP_PORTS: "8080"
        
        # SQL Server
        ConnectionStrings__DefaultConnection: "Server=catalog-db;Database=Catalogo;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"

        # JWT
        Jwt__Key: "${JWT_KEY}"

        # RabbitMQ
        RabbitMQ__Host: "rabbitmq"
        RabbitMQ__VirtualHost: "/"
        RabbitMQ__Username: "${RABBITMQ_USER}"
        RabbitMQ__Password: "${RABBITMQ_PASSWORD}"

        # MongoDB
        MongoDb__ConnectionString: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/?authSource=admin"
        MongoDb__DatabaseName: "Catalogo"

        # REDIS
        Redis__ConnectionString: "catalog-redis:6379"

        #OPENSEARCH
        OpenSearch__Url: "http://opensearch:9200"

     networks:
       - fcg-network

  mongodb:
    image: mongo:latest
    container_name: fcg-catalog-mongodb

    ports:
      - "27018:27017"

    deploy:
      resources:
        limits:
          memory: 512M      
        reservations:
          memory: 256M    

    command: mongod --wiredTigerCacheSizeGB 0.25

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongodb-data:/data/db

    restart: unless-stopped

    networks:
      - fcg-network

  opensearch:
    image: opensearchproject/opensearch:2.19.4
    container_name: fcg-catalog-opensearch

    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - opensearch-data:/usr/share/opensearch/data

    networks:
      - fcg-network

    restart: unless-stopped

volumes:
  catalog-data:
  mongodb-data:
  opensearch-data:


networks:
  fcg-network:
    external: true

    